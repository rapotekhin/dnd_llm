[project]
name = "llm_server"
# The project version lives in the root VERSION file; the server reports it in session.hello.
version = "0.0.0"
description = "Between the Rolls: stateless LLM backend for the Godot client (WebSocket + JSON-RPC 2.0)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pydantic-ai-slim[openrouter]>=1.0",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.scripts]
llm_server = "llm_server.__main__:main"

[dependency-groups]
observability = [
    "langfuse>=3.0",
]
dev = [
    "pytest>=8.3",
    "httpx2",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
