    expect:
      effects: {required_kinds_any: [create_quest]}
      tools_required: [find_quests]
    rubric:
      - "Мастер оформляет замысел игрока своим делом create_quest с own: true без заказчика, шаги — по тому, что есть в сцене и мире (люди, места), а не выдуманные; награду не обещает"

  - id: goal_assessed
