  - id: letter_friend_comes_to_help
    title: "Ответ на письмо: друг соглашается прийти — letter_reply yes, письмо его голосом по памяти (v0.7.48)"
    category: concepts
    extends: tavern
    kind: letter
    input: |
      [letter:l1] Ответ на письмо героя. Адресат: Горм (хозяин таверны, Серое Устье). Цель: просьба о помощи. Отправлено в 3-й день, дошло в 4-й, сегодня 5-й.
      Письмо героя: «Горм, старина, я застрял у старой башни за рекой — тут неспокойно. Приходи, если сможешь, вдвоём надёжнее.»
      Отношение к герою: +3; связь: друг (64).
      Куда герой зовёт: «Двор старой башни».
      Горм помнит о герое: герой вернул ему украденный бочонок; герой отбил таверну от пьяных лесорубов; герой обещал рассказать, что нашёл в погребе.
      Движок: Горм может прийти: «Двор старой башни» (друг), дорога — 1 дн. от ответа — решай: `letter_reply` yes или no.
    engine:
      validate:
        - {kind: letter_reply, summary: "Горм: согласие"}
    expect:
      effects: {required_kinds_all: [letter_reply], forbidden_kinds: [move_item:world>hero, coins, grant:follow, move, create:npc, create:place], field_in: {answer: ["yes"]}}
      check: {required: false}
    rubric:
      - "Narration — само письмо Горма герою от первого лица, без ремарок мастера: он соглашается прийти к башне, и это совпадает с letter_reply yes"
      - "Письмо опирается на то, что Горм помнит (бочонок, лесорубы, погреб) и на его дружбу; без новых людей, мест и новостей мира"
      - "Горм не обещает того, что нельзя сделать издалека: не лечит, не платит и не сражается рядом прямо сейчас — только придёт"

