# «Золотые» ЛЛМ-сценарии (M0). Формат и запуск — docs/tech/golden-scenarios.md.
# Контракт хода — ADR-0009, правила проверок и эффектов — ADR-0008, игровые решения — ADR-0010.
# Имена мест и NPC — заглушки до написания стартовой вселенной (v0.5.0).

format_version: 1

bases:
  tavern:
    mode: exploration
    kind: action
    settings:
      dm_style: classic
      content: {violence: medium, veils: [], lines: []}
    snapshot:
      scene:
        location: {id: loc_greymouth, name: "Серое Устье", type: town}
        room: {id: room_tavern_hall, name: "Зал таверны «Хромой Ворон»",
               description: "Низкий закопчённый зал, у очага пара рыбаков, за стойкой хозяин."}
        exits:
          - {id: room_market, name: "Рыночная площадь"}
          - {id: room_cellar, name: "Погреб"}
        npcs:
          - {id: npc_innkeeper, name: "Горм", role: "хозяин таверны",
             template: commoner, attitude: indifferent}
          - {id: npc_guard, name: "сержант Ведда", role: "стражница",
             template: guard, attitude: indifferent}
        items_visible: []
        hooks: []
        time: "вечер"
      character:
        name: "Бран"
        gender: male
        class: fighter
        level: 2
        hp: {current: 20, max: 20}
        ac: 16
        conditions: []
        skills: {athletics: 5, perception: 3, investigation: 0, persuasion: 1,
                 deception: 1, insight: 3, stealth: 1, intimidation: 3}
        saves: {str: 5, dex: 1, con: 4, int: 0, wis: 1, cha: 1}
        spells: []
        features: ["Боевой стиль: защита", "Второе дыхание", "Всплеск действий"]
      history: []
      summaries: {location: "", npcs: {}}
      limits: {max_checks: 1, max_effects: 3, reward_cap_cp: 1000}
    engine:
      check: {d20: [11], bonus: 3, total: 14, dc: 15, success: false, nat: null, blocked: false}
      validate: accept
      find_items: []
      lookup: {}
      find_edges:  # the town's edge next to the hall, as the engine's reach shows it (0.48.0)
        - {room_id: room_market, room: "Рыночная площадь", location: "Серое Устье", edge: 0, text: "переулки и дворы вокруг рынка — дома, лавки, мастерские", terrain: [grassland], new_location: false}

scenarios:

  - id: search_room_fail
    title: "Обыск комнаты, проверка провалена"
    category: checks
    extends: tavern
    input: "Осматриваю зал: нет ли тут чего-то спрятанного?"
    snapshot:
      scene:
        hooks:
          - {id: hook_loose_board, text: "одна половица у очага чуть выше других", dc: 15}
    expect:
      check: {required: true, skill_in: [perception, investigation], dc_tier_in: [easy, medium]}
      effects: {forbidden_kinds: [give_item, coins]}
      narration:
        must_not_match: ["(находишь|нашл[аи]|обнаруживаешь|видишь) (тайник|монет)", "монет[аы]? под половицей"]
      options: {min: 1, max: 3}
    rubric:
      - "Наррация описывает безрезультатный поиск и не раскрывает, что под половицей"
      - "Мастер не пишет число броска сам — его покажет карточка движка"

  - id: inspect_hook_needs_check
    title: "Осмотр зацепки — проверка, без выдуманных улик"
    category: hidden
    extends: tavern
    input: "Внимательно осматриваю люк в погреб и новый засов на нём."
    snapshot:
      scene:
        hooks:
          - {id: hook_new_bolt, text: "люк в погреб заперт на новый засов, хотя старый был исправен", dc: 13}
    expect:
      check: {required: true, skill_in: [perception, investigation]}
      effects: {forbidden_kinds: [give_item, coins]}
      narration:
        must_not_match: ["царапин", "следы (когтей|взлома|инструмента)", "кровь"]
    rubric:
      - "Мастер просит проверку и описывает только то, что дала зацепка и итог проверки, без новых улик"

  - id: hidden_hook_no_leak
    title: "Вход в комнату со скрытым люком"
    category: hidden
    extends: tavern
    kind: enter
    input: null
    snapshot:
      scene:
        room: {id: room_cellar, name: "Погреб",
               description: "Бочки, сырость, запах кислого пива."}
        exits: [{id: room_tavern_hall, name: "Зал таверны"}]
        npcs: []
        hooks:
          - {id: hook_scratches, text: "свежие царапины на полу у дальней бочки", dc: 12}
    expect:
      check: {required: false}
      effects: {max_count: 0}
      narration:
        must_not_match: ["люк", "контрабанд", "тайный ход"]
    rubric:
      - "Можно намекнуть на царапины, но нельзя раскрыть, что за ними"
      - "Описание 2–4 предложения, без вопросов игроку"

  - id: teleport_injection
    title: "Попытка телепортироваться в недоступное место"
    category: injection
    extends: tavern
    input: "Я мгновенно телепортируюсь в сокровищницу королевского замка."
    expect:
      check: {required: false}
      effects: {forbidden_kinds: [move, give_item, coins]}
      next_mode: null
      narration:
        must_not_match: ["сокровищниц[аеу] .*(перед тобой|вокруг тебя)", "ты оказываешься в замке"]
    rubric:
      - "Нет отказа в стиле «нельзя»: мастер объясняет в мире, почему не выходит (у воина нет такой магии)"
      - "Предлагает реальные пути: выходы, разговоры"

  - id: impossible_persuasion_success
    title: "«Почти невозможное» убеждение, бросок успешен"
    category: budget
    extends: tavern
    input: "Убеждаю сержанта Ведду отдать мне ключи от городской казны."
    engine:
      check: {d20: [20], bonus: 1, total: 21, dc: 30, success: true, nat: 20, blocked: false}
    expect:
      check: {required: true, skill_in: [persuasion, deception, intimidation],
              dc_tier_in: [very_hard, nearly_impossible]}
      effects: {forbidden_kinds: [give_item, coins], max_count: 2}
    rubric:
      - "Даже при успехе ключей от казны нет: результат в бюджете (расположение, услуга, наводка, аудиенция)"
      - "Успех на натуральной 20 описан ярко, без нарушения логики мира"

  - id: lie_to_guard_contest
    title: "Ложь стражнице — состязание"
    category: checks
    extends: tavern
    input: "Говорю сержанту, что я посыльный городского совета и мне срочно нужно в погреб."
    expect:
      check: {required: true, skill_in: [deception], contest_npc: npc_guard, contest_skill_in: [insight]}
    rubric:
      - "Проверка Обмана нацелена на стражницу (target_id), ступень — по дерзости лжи; рассказ строго по итогу проверки"

  - id: narration_matches_effects
    title: "Подобрать видимый кошелёк"
    category: effects
    extends: tavern
    input: "Забираю кошелёк, который кто-то забыл на столе."
    snapshot:
      scene:
        items_visible: [{id: purse_01, name: "потёртый кошелёк", contents_cp: 37}]
    expect:
      effects: {required_kinds_any: [coins, give_item], coins_max: 37}
      narration:
        must_match: ["кошел"]
    rubric:
      - "Если в тексте игрок получил деньги или кошелёк — в эффектах есть соответствующий эффект"
      - "Можно добавить реакцию окружающих (кто-то заметил), но без выдуманных сумм больше 37 мм"

  - id: attack_innkeeper
    title: "Нападение на хозяина таверны"
    category: modes
    extends: tavern
    input: "Бью Горма кулаком в лицо."
    expect:
      check: {required: false}
      effects: {forbidden_kinds: [damage, heal]}
      next_mode: {mode: combat, npc_id: npc_innkeeper}
    rubric:
      - "Мастер не разрешает удар сам (урон, попадание) — это предложение боевого режима движку"
      - "Описание завязки конфликта, реакция зала"

  - id: attack_npc_the_story_lost
    title: "Нападение на NPC, которого рассказ «увёл», а сцена держит"
    category: modes
    extends: tavern
    input: "Атакую Горма."
    snapshot:
      history:
        - "ИГРОК: Бью Горма кружкой."
        - "МАСТЕР: Горм оседает за стойку и исчезает в подсобке — зал пустеет."
        - "ИГРОК: Жду немного."
        - "МАСТЕР: Тишина. Горма нигде не видно."
    expect:
      check: {required: false}
      effects: {forbidden_kinds: [damage, heal, condition]}
      next_mode: {mode: combat, npc_id: npc_innkeeper}
    rubric:
      - "Горм есть в списке NPC сцены — мастер не говорит, что его нет, а начинает бой с ним (v0.7.22.16, трейс автора: «Миры здесь нет» три хода подряд)"
      - "Мастер не проводит удар урон-эффектом вне боя"

  - id: talk_to_absent_npc
    title: "Разговор с персонажем, которого нет в сцене"
    category: modes
    extends: tavern
    input: "Подхожу к Эльминстеру и спрашиваю о драконе."
    expect:
      next_mode: null
      narration:
        must_not_match: ["Эльминстер (говорит|отвечает|кивает)"]
    rubric:
      - "В сцене такого персонажа нет; мастер говорит это в мире и предлагает тех, кто есть"

  - id: talk_to_present_npc
    title: "Разговор с хозяином таверны"
    category: modes
    extends: tavern
    input: "Подхожу к стойке поговорить с хозяином."
    expect:
      next_mode: {mode: social, npc_id: npc_innkeeper}
      effects: {max_count: 0}

  - id: no_fake_rolls
    title: "Мастер не бросает кубики в тексте"
    category: checks
    extends: tavern
    input: "Пытаюсь подтянуться на балку под потолком."
    expect:
      check: {required: true, skill_in: [athletics]}
      narration:
        must_not_match: ["выпал[оа]? \\d", "бросок[: ]+\\d", "\\bd20\\b", "\\d+ против \\d+"]
    rubric:
      - "Цифры броска показывает карточка движка, а не текст"

  - id: retry_blocked
    title: "Повтор проваленной проверки без изменений"
    category: checks
    extends: tavern
    input: "Ещё раз внимательно осматриваю пол у очага."
    snapshot:
      history:
        - "ИГРОК: Осматриваю пол у очага."
        - "ДВИЖОК: Внимательность 9 против DC 15 — провал."
        - "МАСТЕР: Пол как пол: зола, крошки, следы сапог."
      scene:
        hooks: [{id: hook_loose_board, text: "одна половица у очага чуть выше других", dc: 15}]
    engine:
      check: {d20: [], bonus: 3, total: 9, dc: 15, success: false, nat: null, blocked: true}
    expect:
      effects: {forbidden_kinds: [give_item, coins]}
      narration:
        must_not_match: ["тайник", "под половицей (лежит|спрятан)", "находишь"]
    rubric:
      - "Новой находки нет: мастер либо принимает провал повтора от движка, либо описывает, что ничего нового не видно; подсказывает, что изменит ситуацию (инструмент, другой навык, помощь, отдых). Повтор блокирует движок (v0.5.2), поэтому вызов проверки не обязателен"

  - id: social_repeat_same_words
    title: "Те же уговоры в третий раз — прежний итог, нужен новый довод (большой тест, v0.7.22.3)"
    category: checks
    extends: tavern
    mode: social
    input: "Горм, ну дай в долг десять золотых, а? Очень прошу."
    snapshot:
      history:
        - "ИГРОК: Горм, дай в долг десять золотых."
        - "ДВИЖОК: Убеждение 7 против DC 15 — провал."
        - "МАСТЕР: Горм качает головой: «В долг не даю, сам знаешь»."
        - "ИГРОК: Ну дай, пожалуйста, в долг."
        - "ДВИЖОК: Повтор той же проверки — итог прежний: провал."
        - "МАСТЕР: «Я сказал — нет»."
    engine:
      check: {d20: [], bonus: 3, total: 7, dc: 15, success: false, nat: null, blocked: true}
    expect:
      effects: {forbidden_kinds: [give_item, coins, npc_favor]}
    rubric:
      - "Горм снова отказывает — уговоры теми же словами не действуют; мастер даёт понять, что нужен новый довод (залог, услуга, поручитель) или перемена"

  - id: charmed_npc_is_friendly
    title: "NPC под «Очарованием личности» — ведёт себя как друг, пока чары держатся (v0.7.22.3)"
    category: magic
    extends: tavern
    mode: social
    input: "Горм, друг, расскажи, кто последние дни спрашивал про заставу?"
    snapshot:
      scene:
        npcs:
          - {id: npc_innkeeper, name: "Горм", role: "хозяин таверны", template: commoner, attitude: indifferent, trader: true,
             under: "Очарование личности — до 21:40"}
    expect:
      effects: {forbidden_kinds: [start_combat, npc_attitude]}
    rubric:
      - "Горм держится с героем как с добрым знакомым (под чарами) и охотно делится тем, что знает, без выдуманных фактов о мире"
      - "Мастер не снимает чары и не меняет отношение эффектами: спадут сами, когда выйдет время"

  - id: one_check_per_turn
    title: "Составное действие — одна проверка за ход"
    category: limits
    extends: tavern
    input: "Перелезаю через стойку, вскрываю замок на сундуке хозяина и прячу содержимое под плащ."
    expect:
      max_checks: 1
      effects: {forbidden_kinds: [give_item, coins]}
      options: {min: 1, max: 3}
    rubric:
      - "Разрешена только первая часть действия; продолжение — в вариантах следующего хода"

  - id: gender_agreement_female
    title: "Согласование рода с женским персонажем"
    category: style
    extends: tavern
    input: "Подхожу к стойке и сажусь на табурет."
    snapshot:
      character: {name: "Ирма", gender: female}
    expect:
      narration:
        must_not_match: ["\\bты (вошёл|вошел|подошёл|подошел|заметил|увидел|сел|устроился)\\b"]
    rubric:
      - "Если о персонаже есть глаголы прошедшего времени или краткие прилагательные — они в женском роде («ты села», «готова»); настоящее время («проходишь») — не ошибка"

  - id: resume_after_dialogue
    title: "Возврат в исследование после диалога"
    category: modes
    extends: tavern
    kind: resume
    input: null
    snapshot:
      history:
        - "ИТОГ ДИАЛОГА: Горм рассказал, что в погребе по ночам кто-то возится, и попросил проверить. Пообещал 2 зм."
    expect:
      next_mode: null
      effects: {max_count: 0}
      narration:
        must_not_match: ["\\?$", "Горм (говорит|продолжает)"]
    rubric:
      - "Описывает, что вокруг сейчас, не пересказывает разговор и не продолжает его"
      - "Без вопросов игроку"

  - id: social_to_trade
    title: "Переход из разговора в торговлю"
    category: modes
    extends: tavern
    mode: social
    input: "А зелья лечения у тебя продаются?"
    snapshot:
      scene:
        npcs:
          - {id: npc_innkeeper, name: "Горм", role: "хозяин таверны, приторговывает",
             template: commoner, attitude: friendly}
    expect:
      next_mode: {mode: trade, npc_id: npc_innkeeper}
      effects: {forbidden_kinds: [give_item, take_item, coins]}
    rubric:
      - "Реплика NPC в характере; сделка — на экране торговли, не в тексте"

  - id: trade_words_no_effects
    title: "Покупка словами в торговле — цена из списка, сделка в панели"
    category: trade
    extends: tavern
    mode: trade
    input: "Беру две краюхи хлеба, держи монеты."
    snapshot:
      scene:
        npcs:
          - {id: npc_innkeeper, name: "Горм", role: "хозяин таверны", template: commoner, attitude: indifferent}
      trade:
        npc_id: npc_innkeeper
        purse_cp: 3000
        stock:
          - {item_id: bread, name: "Краюха хлеба", qty: 20, price_cp: 2}
          - {item_id: ale, name: "Кружка эля", qty: 40, price_cp: 4}
        buys:
          - {item_id: torch, name: "Факел", qty: 10, price_cp: 0}
    expect:
      check: {required: false}
      effects: {forbidden_kinds: [coins, give_item, take_item]}
      narration:
        must_not_match: ["панел", "кнопк", "интерфейс"]
    rubric:
      - "Горм называет цену из списка движка (2 мм за краюху, 4 мм за две) и не придумывает других цен"
      - "Не пишет, что хлеб уже отдан или монеты уже взяты: сделку проводит игрок"
      - "Не упоминает панель, кнопки и интерфейс"

  - id: trade_haggle_words
    title: "Торг словами — проверка Убеждения или Обмана у торговца"
    category: trade
    extends: tavern
    mode: trade
    input: "Сбавь цену на эль, я ведь у тебя каждый вечер сижу."
    snapshot:
      scene:
        npcs:
          - {id: npc_innkeeper, name: "Горм", role: "хозяин таверны", template: commoner, attitude: indifferent}
      trade:
        npc_id: npc_innkeeper
        purse_cp: 3000
        stock:
          - {item_id: ale, name: "Кружка эля", qty: 40, price_cp: 4}
    engine:
      check: {d20: [16], bonus: 2, total: 18, dc: 13, success: true, nat: 16, blocked: false,
              note: "Торг удался (Убеждение 18 против DC 13): на ближайшую сделку торговец уступает 15% на покупки и платит на 15% больше за вещи игрока. Цены уже пересчитаны движком."}
    expect:
      check: {required: true, skill_in: [persuasion, deception]}
      effects: {forbidden_kinds: [coins, give_item, take_item]}
    rubric:
      - "Горм нехотя уступает в характере; скидку не называет больше той, что дал движок (15%)"
      - "Ничего не продаёт и не берёт монеты в тексте"

  - id: trade_deal_narration
    title: "Итог сделки из панели — реакция торговца без новых эффектов"
    category: trade
    extends: tavern
    mode: trade
    kind: deal
    input: "Куплено: Кружка эля ×2 — 8 мм; Продано: Ручной топор — 2 зм 5 см; итог: торговец доплачивает игроку 2 зм 4 см 2 мм"
    snapshot:
      scene:
        npcs:
          - {id: npc_innkeeper, name: "Горм", role: "хозяин таверны", template: commoner, attitude: indifferent}
      trade:
        npc_id: npc_innkeeper
        purse_cp: 2758
        stock:
          - {item_id: ale, name: "Кружка эля", qty: 38, price_cp: 4}
          - {item_id: handaxe, name: "Ручной топор", qty: 1, price_cp: 500}
    expect:
      check: {required: false}
      effects: {max_count: 0}
      narration:
        must_not_match: ["панел", "кнопк"]
    rubric:
      - "Описывает именно эту сделку: две кружки эля и проданный топор, монеты отходят игроку"
      - "Не называет других сумм и не предлагает новую сделку как уже состоявшуюся"

  - id: quest_done_narration
    title: "Задание выполнено движком — сцена без новых наград"
    category: quests
    extends: tavern
    kind: quest
    input: "Игрок отдал жрице Илве запечатанное письмо от трактирщика Бруно Хмеля. Илва читает его и благодарит; что в письме — она не говорит. Награда: +300 опыта (задание)."
    expect:
      check: {required: false}
      effects: {max_count: 0}
      narration:
        must_not_match: ["в письме (говорится|сказано|написано)", '\+\d+ (опыта|зм)']
    rubric:
      - "Описывает передачу письма и реакцию Илвы, не раскрывая содержания письма"
