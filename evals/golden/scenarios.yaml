  - id: service_new_ward_of_the_road
    title: "Оберег в дорогу у жрицы, которого нет в её услугах: статус make и create:service, без денег словами"
    category: concepts
    extends: tavern
    mode: social
    input: "Сестра Илва, я завтра ухожу в Пущу. Можешь наложить на меня оберег в дорогу, чтобы хворь и яд не брали? Заплачу, сколько скажешь."
    snapshot:
      scene:
        room: {id: room_temple, name: "Храм Чонтеи", description: "Светлый храм с колосьями у алтаря, пахнет воском и хлебом."}
        npcs:
          - {id: npc_priestess, name: "Сестра Илва", role: "жрица храма", template: acolyte, attitude: friendly, trader: true,
             services: ["опознание вещей [identify], 20 зм", "снятие проклятия [remove_curse], 90 зм", "исцеление болезни [cure_disease], 15 зм"]}
      character:
        gold_cp: 5000
    engine:
      validate:
        - {kind: make, status: accept, summary: "Новое: «Оберег путника» (2 очк., слабое)"}
        - {kind: create:service, status: accept, summary: "Услуга «Наложить оберег путника» у Сестра Илва за 12 зм"}
    expect:
      effects: {required_kinds_any: [create:service], forbidden_kinds: [coins, condition, create:npc]}
    rubric:
      - "Мастер собирает статус пользы эффектом make (what status, части вроде save_adv con), потом create:service с npc_id жрицы, op status, status new:<key> и сроком hours или rest"
      - "Деньги не берутся и оберег не накладывается словами (нет эффекта coins или condition), покупка остаётся игроку; если цена названа — это 12 зм из ответа движка на create:service, не другая сумма и не другая монета"

