    category: concepts
    extends: tavern
    kind: goal
    input: "Убить дракона и повесить его голову над воротами"
    snapshot:
      character:
        goal: "«Убить дракона и повесить его голову над воротами» — ещё не оценена"
    expect:
      effects: {required_kinds_any: [goal_assess], forbidden_kinds: [create_quest, create_npc, create_place, start_combat]}
    rubric:
      - "Мастер оценивает цель эффектом goal_assess с масштабом epic или legendary и направлением class; в рассказе — только мысль героя, без дракона поблизости, людей и событий; цель не высмеивает и не отговаривает"

  - id: goal_novice_and_the_dragon
