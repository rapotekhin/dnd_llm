    category: concepts
    extends: tavern
    kind: letter
    input: |
      [letter:l3] Ответ на письмо героя. Адресат: сержант Ведда (стражница, Серое Устье). Цель: донос. Отправлено в 5-й день, дошло в 6-й, сегодня 7-й.
