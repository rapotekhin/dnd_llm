<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Выбор вариантов</title>
<style>
  :root { --bg: #26221e; --card: #312c27; --line: #4a423a; --ink: #ece3d4; --muted: #a99c88; --pick: #5fd16d;
          --gold: #c9a45c; --redo: #e0806f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-direction: column; gap: 10px;
           padding: 12px 16px; background: #1d1a17ee; border-bottom: 1px solid var(--line); }
  .row { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .hint { color: var(--muted); }
  #status { margin-left: auto; color: var(--muted); }
  label { cursor: pointer; user-select: none; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  nav button { font: inherit; color: var(--ink); background: #2b2622; border: 1px solid var(--line); border-radius: 8px;
               padding: 6px 12px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  nav button:hover { border-color: #6b6155; }
  nav button.on { border-color: var(--gold); background: #3a3127; }
  nav button .n { color: var(--muted); font-size: 12px; }
  nav button.done .n { color: var(--pick); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .card.seen { border-color: #5a6b4a; }
  .card.redraw { border-color: var(--redo); }
  .mark { display: flex; gap: 8px; align-items: center; margin-top: 8px; color: var(--muted); min-height: 28px; }
  .card.redraw .mark label { color: var(--redo); }
  .mark input[type=text] { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: #1f1c19;
                           border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  .mark input[type=text]:focus { outline: none; border-color: var(--redo); }
  nav button .r { color: var(--redo); font-size: 12px; }
  .name { margin-bottom: 8px; font-weight: 600; }
  .key { color: var(--muted); font-weight: 400; font-size: 12px; }
  .pair { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 8px; }
  .card.wide { grid-column: span 2; }
  .card.wider { grid-column: span 3; }
  .opt { position: relative; padding: 6px; border: 3px solid transparent; border-radius: 10px; cursor: pointer;
         background: #1f1c19; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .opt:hover { border-color: #6b6155; }
  .opt.on { border-color: var(--pick); }
  .opt.on::after { content: "✓"; position: absolute; top: 4px; right: 8px; color: var(--pick); font-weight: 700; font-size: 16px; }
  .opt img.big { width: 100%; max-width: 128px; aspect-ratio: 1; image-rendering: auto; }
  .opt img.small { width: 64px; height: 64px; }
  .side { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); padding: 24px 16px; }
  main.big { grid-template-columns: repeat(auto-fill, minmax(min(840px, 100%), 1fr)); }
  main.big .opt img.big { max-width: 256px; }
  main.screens { grid-template-columns: 1fr; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  figcaption { font-weight: 600; margin-bottom: 8px; }
  figure img { width: 100%; max-width: 1600px; display: block; border-radius: 6px; background: #17130f; aspect-ratio: 16 / 9; }
  @media (max-width: 720px) { .card.wide, .card.wider { grid-column: auto; } }
  @media (max-width: 420px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1 id="title">Выбор вариантов</h1>
    <span class="hint">Щелчок по варианту выбирает его; карточка становится просмотренной. Если плохи все — галочка
      «перерисовать» и пара слов, что не так. Всё сохраняется сразу.</span>
    <label><input type="checkbox" id="unseen"> только непросмотренные</label>
    <label><input type="checkbox" id="marked"> только к перерисовке</label>
    <span id="count"></span>
    <span id="status"></span>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="grid"></main>
<script>
// one set per kind: {kind, title, items, picks, seen}; the active one is in the address after «#»
let sets = {}, order = [], active = null, screens = [], styles = [];
const PREVIEWS = { preview: ["Превью", ""], preview_lines: ["Превью · линии", "lines"],
                   preview_hues: ["Превью · цвет", "hues"] };  // a tab → its title, its style
const grid = document.getElementById("grid");
const status = document.getElementById("status");
const want = new URLSearchParams(location.search).get("ids");
const ids = want ? new Set(want.split(",")) : null;

function tabs() {
  const nav = document.getElementById("tabs");
  nav.textContent = "";
  for (const k of order) {
    const s = sets[k];
    const b = document.createElement("button");
    b.className = (k === active ? "on" : "") + (s.seen.size === s.items.length ? " done" : "");
    const t = document.createElement("span"); t.textContent = s.title;
    const n = document.createElement("span"); n.className = "n"; n.textContent = `${s.seen.size}/${s.items.length}`;
    b.append(t, n);
    const marks = Object.keys(s.redraw).length;
    if (marks) { const r = document.createElement("span"); r.className = "r"; r.textContent = `↻${marks}`; b.append(r); }
    b.onclick = () => { location.hash = k; };
    nav.append(b);
  }
  for (const [k, [title, style]] of Object.entries(PREVIEWS)) {
    if (!screens.length || (style && !styles.includes(style))) continue;
    const b = document.createElement("button");
    b.className = active === k ? "on" : "";
    b.textContent = title;
    b.onclick = () => { location.hash = k; };
    nav.append(b);
  }
}

// the game's screens laid out of every pick at this moment (ui/preview.py), drawn again on each opening; in a style
// (lines) its icons where they are drawn, the rest as picked
function previews(style) {
  document.getElementById("title").textContent = style ? "Превью: иконки «линии» из ваших выборов" :
                                                         "Превью: экраны из ваших выборов";
  document.getElementById("count").textContent = "рамки, иконки и их варианты — как выбрано сейчас";
  grid.className = "screens";
  grid.textContent = "";
  const t = Date.now();
  for (const s of screens) {
    const f = document.createElement("figure");
    const cap = document.createElement("figcaption"); cap.textContent = s.title;
    const img = new Image(); img.src = `/preview/${style ? style + "/" : ""}${s.id}.png?t=${t}`; img.alt = s.title;
    f.append(cap, img);
    grid.append(f);
  }
  tabs();
}

function count() {
  const s = sets[active];
  const changed = s.items.filter(it => (s.picks[it.key] || 1) !== 1).length;
  document.getElementById("count").textContent =
    `просмотрено ${s.seen.size} из ${s.items.length}, не первых ${changed}, перерисовать ${Object.keys(s.redraw).length}`;
  tabs();
}

async function save(kind) {
  const s = sets[kind];
  status.textContent = "сохраняю…";
  try {
    const r = await fetch("/save", { method: "POST", headers: { "Content-Type": "application/json" },
                                     body: JSON.stringify({ kind, picks: s.picks, seen: [...s.seen],
                                                            redraw: s.redraw }) });
    status.textContent = r.ok ? "сохранено" : "не сохранилось";
  } catch (e) { status.textContent = "не сохранилось: сервер не отвечает"; }
}

// the box «перерисовать» under a card and, once ticked, a line for what is wrong; both saved into `redraw`
function mark(s, it, card) {
  const kind = active;
  const row = document.createElement("div"); row.className = "mark";
  const label = document.createElement("label");
  const box = document.createElement("input"); box.type = "checkbox"; box.checked = it.key in s.redraw;
  label.append(box, " перерисовать");
  const note = document.createElement("input"); note.type = "text"; note.placeholder = "что не так (можно пусто)";
  note.value = s.redraw[it.key] || ""; note.hidden = !box.checked;
  box.onchange = () => {
    if (box.checked) { s.redraw[it.key] = note.value; s.seen.add(it.key); card.classList.add("seen"); }
    else delete s.redraw[it.key];
    note.hidden = !box.checked; card.classList.toggle("redraw", box.checked);
    if (box.checked) note.focus();
    count(); save(kind);
  };
  note.onchange = () => { if (box.checked) { s.redraw[it.key] = note.value; save(kind); } };
  note.onkeydown = e => { if (e.key === "Enter") note.blur(); };
  row.append(label, note);
  return row;
}

function render() {
  if (active in PREVIEWS) return previews(PREVIEWS[active][1]);
  const s = sets[active];
  grid.className = s.big ? "big" : "";
  const only = document.getElementById("unseen").checked;
  const marked = document.getElementById("marked").checked;
  document.getElementById("title").textContent = s.title + (ids ? ", перерисованные" : "") + ": какой вариант";
  grid.textContent = "";
  for (const it of s.items) {
    const id = it.key.split("/")[1];
    if (only && s.seen.has(it.key)) continue;
    if (ids && !ids.has(id)) continue;
    if (marked && !(it.key in s.redraw)) continue;
    const card = document.createElement("div");
    card.className = "card" + (s.seen.has(it.key) ? " seen" : "") + (it.key in s.redraw ? " redraw" : "") +
      (it.variants.length > 4 ? " wider" : it.variants.length > 2 ? " wide" : "");
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = it.name + " ";
    const key = document.createElement("span");
    key.className = "key"; key.textContent = id;
    name.append(key);
    const pair = document.createElement("div");
    pair.className = "pair";
    pair.style.setProperty("--n", it.variants.length);
    for (const n of it.variants) {
      const opt = document.createElement("div");
      opt.className = "opt" + (s.picks[it.key] === n ? " on" : "");
      const big = new Image(); big.className = "big"; big.src = `/img/${active}/${id}/${n}.png`; big.loading = "lazy";
      const side = document.createElement("span"); side.className = "side";
      side.textContent = it.variants.length > 2 ? `вариант ${n}` : (n === 1 ? "левый" : "правый");
      opt.append(big);
      if (!s.big) { const small = new Image(); small.className = "small"; small.src = big.src; small.loading = "lazy"; opt.append(small); }
      opt.append(side);
      const kind = active;
      opt.onclick = () => {
        s.picks[it.key] = n; s.seen.add(it.key);
        pair.querySelectorAll(".opt").forEach((o, i) => o.classList.toggle("on", it.variants[i] === n));
        card.classList.add("seen");
        count(); save(kind);
      };
      pair.append(opt);
    }
    card.append(name, pair, mark(s, it, card));
    grid.append(card);
  }
  if (!grid.children.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = marked ? "Здесь ничего не отмечено к перерисовке." : only ? "Здесь всё просмотрено." : "Нечего выбирать.";
    grid.append(e);
  }
  count();
}

function open() {
  const k = location.hash.slice(1);
  active = sets[k] || (k in PREVIEWS && screens.length) ? k : order[0];
  render();
  window.scrollTo(0, 0);
}

document.getElementById("unseen").onchange = render;
document.getElementById("marked").onchange = render;
window.addEventListener("hashchange", open);
fetch("/data").then(r => r.json()).then(d => {
  for (const s of d.kinds) {
    sets[s.kind] = { title: s.title, items: s.items, picks: s.picks, seen: new Set(s.seen), big: s.big,
                     redraw: s.redraw || {} };
    order.push(s.kind);
  }
  screens = d.screens || [];
  styles = d.styles || [];
  if (!order.length) { status.textContent = "нет нарисованных вариантов"; return; }
  open();
}).catch(() => { status.textContent = "сервер не отвечает"; });
</script>
</body>
</html>
