# docker compose -f infra/dev/compose.yaml up -d   (llm_server runs on the host: uv run llm_server)
services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      # Both loopbacks: Godot resolves "localhost" to ::1 first and does not fall back to 127.0.0.1.
      - "127.0.0.1:8443:8443"
      - "[::1]:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
